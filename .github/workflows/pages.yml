name: Deploy Proxyrun website
on:
  workflow_dispatch:
    inputs:
      include_packages:
        description: Publish reviewed APT packages and third-party sources too
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the website
        run: |
          mkdir site
          cp index.html site/index.html
      - name: Download reviewed support files from the private repository
        if: inputs.include_packages
        env:
          GH_TOKEN: ${{ secrets.PROXYRUN_SUPPORT_READ_TOKEN }}
          GH_REPO: stependiant/proxyrun
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure PROXYRUN_SUPPORT_READ_TOKEN with Contents: read access to stependiant/proxyrun before deploying Pages."
            exit 1
          fi
          gh release download distribution-v0.1.0-beta.1 --pattern proxyrun-apt-noble-amd64.tar.gz --pattern proxyrun-third-party-0.1.0-beta.1.tar.gz --pattern SHA256SUMS --dir download
          cd download
          awk '$2 == "proxyrun-apt-noble-amd64.tar.gz" { print }' SHA256SUMS > apt.sha256
          test "$(wc -l < apt.sha256)" -eq 1
          sha256sum --check apt.sha256
          awk '$2 == "proxyrun-third-party-0.1.0-beta.1.tar.gz" { print }' SHA256SUMS > sources.sha256
          test "$(wc -l < sources.sha256)" -eq 1
          sha256sum --check sources.sha256
          mkdir -p ../site/third-party/0.1.0-beta.1
          cp proxyrun-third-party-0.1.0-beta.1.tar.gz ../site/third-party/0.1.0-beta.1/
          tar -xzf proxyrun-apt-noble-amd64.tar.gz -C ../site --no-same-owner
          test -f ../site/apt/dists/noble/InRelease
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
