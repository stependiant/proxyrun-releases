name: Deploy Proxyrun website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read published APT and third-party data
        uses: actions/checkout@v4
        with:
          ref: website-data
          path: published-data
          persist-credentials: false
      - name: Stage the public site
        run: |
          test -f published-data/apt/dists/noble/InRelease
          test -f published-data/third-party/0.1.0-beta.1/proxyrun-third-party-0.1.0-beta.1.tar.gz
          mkdir site
          cp index.html site/index.html
          cp -R wiki site/wiki
          cp published-data/SHA256SUMS site/SHA256SUMS
          cp -R published-data/apt published-data/third-party site/
          gpgv --keyring "$PWD/site/apt/proxyrun-archive-keyring.gpg" site/apt/dists/noble/InRelease
          cd site/third-party/0.1.0-beta.1
          awk '$2 == "proxyrun-third-party-0.1.0-beta.1.tar.gz" { print }' ../../SHA256SUMS > sources.sha256
          test "$(wc -l < sources.sha256)" -eq 1
          sha256sum --check sources.sha256
          rm sources.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
