name: Deploy Proxyrun website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read published APT and third-party data
        uses: actions/checkout@v4
        with:
          ref: website-data
          path: published-data
          persist-credentials: false
      - name: Stage the public site
        run: |
          version="$(python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          update = json.loads(Path('update.json').read_text())
          version = update['latest']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version)
          package = update['packages']['windows-x64']
          expected = f'https://github.com/stependiant/proxyrun-releases/releases/download/v{version}/Proxyrun-Windows-x64-Setup.exe'
          assert update['schema'] == 1 and package['url'] == expected and package['size'] > 0
          sums = dict(line.split('  ', 1)[::-1] for line in Path('published-data/SHA256SUMS').read_text().splitlines())
          assert package['sha256'] == sums['Proxyrun-Windows-x64-Setup.exe']
          apt = Path('published-data/apt').resolve()
          release = subprocess.check_output(['gpgv', '--keyring', str(apt/'proxyrun-archive-keyring.gpg'),
              '--output', '-', str(apt/'dists/noble/InRelease')], text=True)
          index = apt/'dists/noble/main/binary-amd64/Packages'
          signed_hash = re.search(r'^ ([a-f0-9]{64}) +[0-9]+ +main/binary-amd64/Packages$', release, re.M)
          assert signed_hash and hashlib.sha256(index.read_bytes()).hexdigest() == signed_hash[1]
          entries = [dict(line.split(': ', 1) for line in block.splitlines() if line and not line.startswith(' '))
              for block in index.read_text().strip().split('\n\n')]
          for name in ('proxyrun', 'proxyrun-gui'):
              current = [entry for entry in entries if entry['Package'] == name and entry['Version'] == version.replace('-', '~', 1)]
              assert len(current) == 1, f'Missing or duplicate current APT package: {name}'
              filename = f'{name}_{version}_amd64.deb'
              assert current[0]['Filename'] == 'pool/main/p/proxyrun/' + filename
              assert current[0]['SHA256'] == sums[filename]
              with (apt/current[0]['Filename']).open('rb') as package_file:
                  assert hashlib.file_digest(package_file, 'sha256').hexdigest() == sums[filename]
          print(version)
          PY
          )"
          test -f published-data/apt/dists/noble/InRelease
          test -d "published-data/third-party/$version"
          mkdir site
          cp index.html site/index.html
          cp update.json site/update.json
          cp -R wiki site/wiki
          cp sitemap.xml site/sitemap.xml
          cp indexnow.txt site/indexnow.txt
          cp -R assets site/assets
          cp published-data/SHA256SUMS site/SHA256SUMS
          cp -R published-data/apt published-data/third-party site/
          # Source archives can exceed Git's file limit. Only website-data stores
          # chunks; the deployed site serves the reconstructed, verified archive.
          for source in published-data/third-party/*/proxyrun-third-party-*.tar.gz.part-000; do
            test -f "$source" || continue
            combined="${source%.part-000}"
            target="site/${combined#published-data/}"
            cat "$combined".part-* > "$target"
            rm "$target".part-*
          done
          for sums in site/third-party/*/SHA256SUMS; do
            (cd "$(dirname "$sums")" && sha256sum --check SHA256SUMS)
          done
          cd "site/third-party/$version"
          awk -v name="proxyrun-third-party-$version.tar.gz" '$2 == name { print }' ../../SHA256SUMS > sources.sha256
          test "$(wc -l < sources.sha256)" -eq 1
          sha256sum --check sources.sha256
          rm sources.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
